apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mc-router
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mc-router
subjects:
  - kind: ServiceAccount
    name: mc-router
roleRef:
  kind: Role
  name: mc-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: mc-router
  labels:
    {{- include "minecraft.labels" (dict "name" "mc-router" "root" $) | nindent 4 }}
spec:
  type: {{ .Values.router.service.type }}
  selector:
    {{- include "minecraft.selectorLabels" (dict "name" "mc-router") | nindent 4 }}
  ports:
    - name: minecraft
      port: {{ .Values.router.service.port }}
      targetPort: 25565
      {{- with .Values.router.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  labels:
    {{- include "minecraft.labels" (dict "name" "mc-router" "root" $) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" (dict "name" "mc-router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft.labels" (dict "name" "mc-router" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: mc-router
      containers:
        - name: mc-router
          image: {{ .Values.router.image }}
          args: ["--in-kube-cluster"]
          env:
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: minecraft
              containerPort: 25565
          readinessProbe:
            tcpSocket:
              port: 25565
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
