apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "minecraft.fullname" . }}
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "minecraft.fullname" . }}
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft.labels" . | nindent 8 }}
    spec:
      # NOTE: fix volume ownership to 1000 on mismatch; especially useful 
      # when importing world data from other machine.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minecraft
          image: "itzg/minecraft-server:{{ .Values.image.tag }}"
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: {{ .Values.minecraft.type | quote }}
            - name: VERSION
              value: {{ .Values.minecraft.version | quote }}
            - name: FORGE_VERSION
              value: {{ .Values.minecraft.forgeVersion | quote }}
            - name: INIT_MEMORY
              value: {{ .Values.minecraft.initMemory | quote }}
            - name: MAX_MEMORY
              value: {{ .Values.minecraft.maxMemory | quote }}
            - name: MOTD
              value: {{ .Values.minecraft.motd | quote }}
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENABLE_COMMAND_BLOCK
              value: "TRUE"
          startupProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
            initialDelaySeconds: 30
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "minecraft.fullname" . }}
  labels:
    {{- include "minecraft.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "minecraft.selectorLabels" . | nindent 4 }}
  ports:
    - name: minecraft
      port: {{ .Values.service.port }}
      targetPort: 25565
      nodePort: {{ .Values.service.nodePort }}