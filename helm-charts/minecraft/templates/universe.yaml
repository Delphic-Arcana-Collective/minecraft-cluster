{{- range $name, $inst := .Values.instances }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "minecraft.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" (dict "name" $name) | nindent 6 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "minecraft.labels" (dict "name" $name "root" $) | nindent 8 }}
    spec:
      # NOTE: fix volume ownership to 1000 on mismatch; especially useful
      # when importing world data from other machine.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minecraft
          image: "itzg/minecraft-server:{{ $inst.image.tag }}"
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: {{ $inst.type | quote }}
            - name: VERSION
              value: {{ $inst.version | quote }}
            {{- with $inst.forgeVersion }}
            - name: FORGE_VERSION
              value: {{ . | quote }}
            {{- end }}
            - name: INIT_MEMORY
              value: {{ $inst.initMemory | quote }}
            - name: MAX_MEMORY
              value: {{ $inst.maxMemory | quote }}
            - name: MOTD
              value: {{ $inst.motd | quote }}
            - name: ONLINE_MODE
              value: "FALSE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENABLE_COMMAND_BLOCK
              value: "TRUE"
          startupProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
                - --host
                - localhost
                - --port
                - "25565"
          resources:
            {{- toYaml $inst.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: {{ $inst.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "minecraft.labels" (dict "name" $name "root" $) | nindent 4 }}
  {{- with $inst.externalServerName }}
  annotations:
    mc-router.itzg.me/externalServerName: {{ . | quote }}
  {{- end }}
spec:
  type: {{ $inst.service.type }}
  selector:
    {{- include "minecraft.selectorLabels" (dict "name" $name) | nindent 4 }}
  ports:
    - port: 25565
      targetPort: 25565
      {{- with $inst.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
